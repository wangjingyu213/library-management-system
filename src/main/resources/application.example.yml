server:
  port: 8080

spring:
  application:
    name: library-management-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 请填写你的MySQL密码
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.library.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: 请替换为长度足够的随机密钥
    expiration-minutes: 120
