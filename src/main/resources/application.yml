server:
  port: 8080

spring:
  application:
    name: library-management-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/library_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    # Keep credentials out of the repository; set DB_PASSWORD in the shell before startup.
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.library.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:11434/v1}
    api-key: ${AI_API_KEY:ollama}
    model: ${AI_MODEL:qwen2.5:7b}
  jwt:
    secret: ${JWT_SECRET:请替换为长度足够的随机密钥}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
